name: Auditoria do Site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validacao-estatica:
    name: Validação de código (HTML, links internos, JS)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes locais (HTML, links internos, console de erros JS)
        run: node scripts/test-local.js

      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-validacao-local
          path: relatorio-local.md

  teste-producao:
    name: Teste do site em produção (links de afiliado, performance)
    runs-on: ubuntu-latest
    needs: validacao-estatica
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Esperar o deploy terminar de propagar
        run: sleep 90

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes em produção (status, links de afiliado, performance básica)
        run: node scripts/test-producao.js
        env:
          SITE_URL: https://portaldascontas.com.br

      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-producao
          path: relatorio-producao.md

      - name: Rodar Lighthouse (performance)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://portaldascontas.com.br/
            https://portaldascontas.com.br/calculadoras/inss
            https://portaldascontas.com.br/calculadoras/tinta
            https://portaldascontas.com.br/calculadoras/imc
          uploadArtifacts: true
          temporaryPublicStorage: true
