name: Auditoria do Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validacao-estatica:
    name: Validação de código (HTML, links internos, JS)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar suíte permanente de testes
        run: npm test

      - name: Validar build de deploy
        run: node scripts/prepare-deploy.js

      - name: Verificar isolamento B1
        run: npm run test:isolation

      - name: Salvar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: playwright-report

      - name: Rodar testes locais (HTML, links internos, console de erros JS)
        run: node scripts/test-local.js

      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-validacao-local
          path: relatorio-local.md

  teste-producao:
    name: Teste do site em produção (links de afiliado, performance)
    runs-on: ubuntu-latest
    needs: validacao-estatica
    if: github.event_name != 'pull_request'
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Esperar o deploy terminar de propagar
        run: sleep 90

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes em produção (status, links de afiliado, performance básica)
        run: node scripts/test-producao.js
        env:
          SITE_URL: https://portaldascontas.com.br

      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-producao
          path: relatorio-producao.md

      - name: Rodar Lighthouse (performance)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://portaldascontas.com.br/
            https://portaldascontas.com.br/calculadoras/inss
            https://portaldascontas.com.br/calculadoras/tinta
            https://portaldascontas.com.br/calculadoras/imc
          uploadArtifacts: true
          temporaryPublicStorage: true

  analytics-backend:
    name: Analytics backend (PostgreSQL temporário)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: validation_b1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/validation_b1_test
      ANALYTICS_TEST_DB: '1'
      RATE_LIMIT_HMAC_SECRET: segredo-somente-para-ci-com-32-bytes
      ALLOWED_ORIGINS: http://127.0.0.1:8765
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Preparar roles PostgreSQL de teste
        run: npm run db:roles:test

      - name: Aplicar migrações no PostgreSQL temporário
        run: npm run db:migrate:test

      - name: Rodar testes de analytics
        run: npm run test:analytics

  b1-artifact-linux:
    name: B1 artifact and deploy gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instalar dependências B1
        run: npm ci --no-audit --no-fund
        working-directory: validation-b1

      - name: Instalar navegador do consentimento B1
        run: npx playwright install --with-deps chromium
        working-directory: validation-b1

      - name: Build B1 isolado
        run: npm run sync:shared && npm run build
        working-directory: validation-b1

      - name: Testes B1, contrato, adversarial e symlink
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-reporter=tap \
            tests/shared-manifest.spec.mjs \
            tests/b1.spec.mjs \
            tests/artifact.spec.mjs \
            tests/gate.spec.mjs | tee /tmp/b1-tests.tap
          ! grep -q '# SKIP' /tmp/b1-tests.tap
        working-directory: validation-b1

      - name: Consentimento B1
        run: npm run test:browser
        working-directory: validation-b1

      - name: Build e validacao do gate sem publicar
        run: npm run deploy:b1 -- --check
        working-directory: validation-b1
